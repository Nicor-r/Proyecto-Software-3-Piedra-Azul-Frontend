<div class="agendador-contenedor">
  <!-- Barra lateral (Sidebar) -->
  <aside class="sidebar">
    <div class="sidebar__marca">
      <span class="sidebar__icono-marca">PA</span>
      <span class="sidebar__nombre-marca">Piedra Azul</span>
    </div>

    <nav class="sidebar__menu" aria-label="Menú del agendador">
      <ng-container *ngFor="let item of menu">
        <a
          *ngIf="item.ruta; else itemDeshabilitado"
          class="sidebar__item"
          [routerLink]="item.ruta"
          routerLinkActive="sidebar__item--activo"
        >
          <span class="sidebar__icono" [ngSwitch]="item.icono">
            <svg *ngSwitchCase="'resumen'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" />
              <rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" />
            </svg>
            <svg *ngSwitchCase="'citas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
            <svg *ngSwitchCase="'medicos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" />
              <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4" />
              <circle cx="20" cy="10" r="2" />
            </svg>
            <svg *ngSwitchCase="'pacientes'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <span class="sidebar__etiqueta">{{ item.etiqueta }}</span>
        </a>

        <ng-template #itemDeshabilitado>
          <div class="sidebar__item sidebar__item--inactivo" [title]="item.etiqueta + ' (próximamente)'">
            <span class="sidebar__icono" [ngSwitch]="item.icono">
              <svg *ngSwitchCase="'resumen'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" />
              </svg>
              <svg *ngSwitchCase="'medicos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" />
                <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4" />
                <circle cx="20" cy="10" r="2" />
              </svg>
              <svg *ngSwitchCase="'pacientes'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <span class="sidebar__etiqueta">{{ item.etiqueta }}</span>
          </div>
        </ng-template>
      </ng-container>
    </nav>

    <!-- Usuario en parte inferior del sidebar -->
    <div class="sidebar__usuario">
      <div class="sidebar__usuario-info">
        <div class="avatar-circular avatar-circular--oscuro">Lu</div>
        <div class="sidebar__usuario-textos">
          <strong class="sidebar__usuario-nombre">Luisa</strong>
          <span class="sidebar__usuario-rol">Agendador</span>
        </div>
      </div>
      <button class="sidebar__btn-salir" type="button" (click)="cerrarSesion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Área de contenido principal -->
  <div class="principal">
    <!-- Encabezado superior azul -->
    <header class="topbar">
      <div class="topbar__centro">
        <h1 class="topbar__titulo">Piedra Azul</h1>
        <p class="topbar__subtitulo">Panel Agendador</p>
      </div>
      <div class="topbar__usuario">
        <div class="avatar-circular avatar-circular--oscuro">Lu</div>
        <span class="topbar__usuario-nombre">Luisa, Agendador</span>
      </div>
    </header>

    <!-- Vista de contenido -->
    <main class="principal__cuerpo">
      <router-outlet></router-outlet>
    </main>

    <!-- Pie de página -->
    <footer class="footer-global">
      © 2026 Piedra Azul. Todos los derechos reservados.
    </footer>
  </div>
</div>
