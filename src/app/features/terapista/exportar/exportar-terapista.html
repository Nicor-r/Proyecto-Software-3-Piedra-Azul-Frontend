<div class="contenido-header">
  <h1>Exportar citas</h1>
  <p>Descarga tus citas de una fecha en un archivo CSV compatible con Excel, para organizar el ingreso de los pacientes a consulta.</p>
</div>

<div class="tarjeta-busqueda" style="padding: 2rem;">
  <form (ngSubmit)="descargarCSV()">
    <div style="display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap;">
      
      <!-- Campo 1: Médico / Terapista (Solo lectura) -->
      <div style="flex: 1; min-width: 200px;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Médico / Terapista</label>
        <input 
          type="text" 
          [value]="nombreTerapista" 
          disabled 
          style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; background-color: #f5f5f5; color: #666;">
      </div>

      <!-- Campo 2: Fecha -->
      <div style="flex: 1; min-width: 150px;">
        <label for="fecha" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Fecha</label>
        <input 
          id="fecha"
          type="date" 
          [(ngModel)]="fechaExportar" 
          name="fecha"
          style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px;">
      </div>

      <!-- Campo 3: Estado (Visual) -->
      <div style="flex: 1; min-width: 150px;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Estado</label>
        <select 
          [(ngModel)]="estadoExportar" 
          name="estado"
          style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px;">
          <option value="TODOS">Todos los estados</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="COMPLETADA">Completada</option>
        </select>
      </div>

      <!-- Botón -->
      <div>
        <button type="submit" [disabled]="!fechaExportar || exportando()" class="btn-primario" style="padding: 0.75rem 1.5rem;">
          {{ exportando() ? 'Generando...' : 'Exportar CSV' }}
        </button>
      </div>

    </div>
  </form>

  <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #666;">
    El archivo incluye Hora, Paciente, Cédula, Teléfono y Estado, ordenado por hora y separado por punto y coma (;).
  </p>
</div>
